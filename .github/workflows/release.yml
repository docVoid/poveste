name: Release

permissions:
  contents: write
  id-token: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    # v0.1.0 was published manually and exists only as the changelog baseline —
    # never auto-release it (would republish 0.1.0 and emit full-history notes).
    if: github.ref_name != 'v0.1.0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4.0.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Create GitHub release
        run: npx changelogithub
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Tokenless publish via npm Trusted Publishing (OIDC) — needs `id-token: write`
      # above and a Trusted Publisher configured per package on npmjs.com (which
      # requires each package to have been published once already).
      - name: Publish to npm
        run: pnpm -r publish --provenance --access public --no-git-checks
